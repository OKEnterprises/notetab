<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tabmargin — Reset password</title>
  <!-- Root-absolute paths so this resolves the same at /reset-password and
       /reset-password.html. fonts.css + tokens.css are copied from the
       extension at build; Fraunces' @font-face lives in pages.css. -->
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/pages.css">
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <form id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" required minlength="6">
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" required minlength="6">
      <button id="submit" type="submit">Set password</button>
      <div id="error" class="error" role="alert" hidden></div>
    </form>
    <div id="done" hidden>
      <p class="ok">Password updated. You can close this tab and sign in again.</p>
    </div>
    <p class="meta" id="meta">This link expires shortly. Finish here.</p>
  </div>
  <script src="/reset-password.js"></script>
</body>
</html>
